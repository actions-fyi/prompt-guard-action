name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  renovate:
    name: Renovate
    # The union of what the jobs of _renovate.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the Renovate configs
      id-token: write # Let the fix job get a commit token from Octo STS
    uses: actions-fyi/shared-workflows/.github/workflows/_renovate.yml@v1.2.0
