name: Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: zizmor
    # What the zizmor job of _zizmor.yml declares; a called job can't get more.
    permissions:
      security-events: write # Upload the SARIF results to code scanning
      contents: read # Check out the repository
      actions: read # Let upload-sarif read the workflow run
    uses: actions-fyi/shared-workflows/.github/workflows/_zizmor.yml@3846a95a41212282762d6d8769d7f6efe3c7078c # v0.9.0
