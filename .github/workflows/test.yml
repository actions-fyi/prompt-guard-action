name: Test
# The unit tests, as Test / Unit, on pull requests and in the merge queue. They need no secret and
# no live service: they mock fetch and Octokit. actionlint isn't run here, because the org's
# ruleset already lints every pull request, with this repository's .github/actionlint.yaml. The
# integration test against the live service, Test / Integration, is integration.yml, which can
# only run from main or the merge queue.
on:
  pull_request:
  merge_group:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.3
        with:
          egress-policy: audit
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # The Node version that actions/github-script v9 runs the action with.
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Run Unit Tests
        run: node --test test/*.test.js
