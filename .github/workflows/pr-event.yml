name: PR Event
# Exists so workflow_run listeners can run with secrets for fork pull requests too.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  record:
    name: Record
    # Not in a fork: it only starts listeners, which skip in forks.
    if: github.repository_owner == 'actions-fyi'
    runs-on: ubuntu-24.04-firewall
    permissions:
      contents: read # The egress firewall reads .github/egress-firewall.yaml with this token
    concurrency:
      group: pr-event-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Record Event
        run: echo "::notice::Pull request event recorded for workflow_run listeners"
