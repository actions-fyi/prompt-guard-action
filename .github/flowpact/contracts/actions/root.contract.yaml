$schema: https://ciatlas.github.io/flowpact/schemas/contract/v1.json
version: 1
kind: action
path: .
name: Prompt Guard
interface:
  inputs:
    access-client-id:
      required: false
      default: ''
      description: The Cloudflare Access service token's client ID, sent as CF-Access-Client-Id. Set it and access-client-secret together, or neither when TEI has no Access gate in front of it.
    access-client-secret:
      required: false
      default: ''
      description: The Cloudflare Access service token's client secret, sent as CF-Access-Client-Secret.
    address:
      required: true
      description: The base URL of the TEI service, e.g. https://prompt-guard.example.com. It must be https unless allow-insecure-address is true.
    allow-insecure-address:
      required: false
      default: 'false'
      description: Whether address may be plain http, which sends the credentials unencrypted.
    api-key:
      required: false
      default: ''
      description: TEI's API key, sent as Authorization Bearer. Empty sends no Authorization header.
    bot-login:
      required: false
      default: github-actions[bot]
      description: The login that github-token posts as, used to find this action's own comment and issue. Set it when github-token is a personal access token or an app's token, e.g. my-app[bot].
    dry-run:
      required: false
      default: 'false'
      description: Scan and set every output, but make no changes on GitHub.
    files:
      required: false
      default: ''
      description: Files to screen, one name=path per line, e.g. "comment=previous-comment.md", for text that isn't in the payload. Paths are relative to files-directory and must stay inside it.
    files-directory:
      required: false
      default: ''
      description: The directory that files are read from. Empty means GITHUB_WORKSPACE.
    github-token:
      required: false
      default: ${{ github.token }}
      description: The token for escalation.
    label:
      required: false
      default: prompt-guard:flagged
      description: The label for a flagged pull request or escalation issue. Empty adds none.
    malicious-label:
      required: false
      default: MALICIOUS
      description: The model's label whose score is checked against the threshold.
    marker:
      required: false
      default: <!-- prompt-guard -->
      description: The hidden HTML comment that identifies this action's comment or issue.
    mode:
      required: false
      default: audit
      description: "audit: a flagged text sets the outputs and escalates, but doesn't fail the step. block: it also fails the step."
    notify:
      required: false
      default: ''
      description: Handles to mention when escalating, e.g. "@org/moderators @octocat".
    payload-fields:
      required: false
      default: ''
      description: Dot paths into the event payload of the texts to screen, separated by newlines or commas, e.g. "pull_request.title, pull_request.body". Each path is also the text's name. Empty and null fields are skipped.
    require-fields:
      required: false
      default: 'true'
      description: Whether a payload-fields path that isn't in the event payload is the verdict error, so a misspelled path such as pull_request.bdy fails instead of being skipped while the run looks clean. false makes it a warning, for paths that only some events carry.
    require-text:
      required: false
      default: 'true'
      description: Whether finding nothing to screen, every field and file empty or missing, is the verdict error. false makes it a warning and the verdict clean.
    threshold:
      required: false
      default: '0.5'
      description: The score, between 0 and 1, at or above which a text is flagged.
  outputs:
    escalated:
      description: true when the comment or the issue was posted.
      value: ${{ steps.guard.outputs.escalated }}
    flagged:
      description: A JSON array of the flagged names.
      value: ${{ steps.guard.outputs.flagged }}
    scores:
      description: A JSON object mapping each screened name to its highest score.
      value: ${{ steps.guard.outputs.scores }}
    verdict:
      description: clean, flagged or error. Empty means the step failed before it could screen anything; treat that as error.
      value: ${{ steps.guard.outputs.verdict }}
    would-escalate:
      description: true when a text was flagged, so the action escalates unless it's a dry run.
      value: ${{ steps.guard.outputs.would-escalate }}
consumers:
  - from: .github/workflows/_shared.yml
    job: guard
    step: guard
    passes:
