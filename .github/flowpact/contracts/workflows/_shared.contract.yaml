# Generated by flowpact — do not edit by hand. Run `flowpact generate` to update.
# Docs: https://ciatlas.github.io/flowpact/docs/contracts
$schema: https://ciatlas.github.io/flowpact/schemas/contract/v1.json
version: 1
kind: workflow
path: .github/workflows/_shared.yml
name: Prompt Guard
triggers:
  - workflow_call
interface:
  inputs:
    artifact:
      type: string
      required: false
      default: ''
      description: The name of an artifact, uploaded by the caller earlier in the same run, that holds the files to screen.
    dry-run:
      type: boolean
      required: false
      default: false
      description: Scan and set every output, but make no changes on GitHub.
    files:
      type: string
      required: false
      default: ''
      description: The files in the artifact to screen, one name=path per line, e.g. "comment=previous-comment.md".
    label:
      type: string
      required: false
      default: prompt-guard:flagged
      description: The label for a flagged pull request or escalation issue. Empty adds none.
    marker:
      type: string
      required: false
      default: <!-- prompt-guard -->
      description: The hidden HTML comment that identifies the escalation comment or issue.
    mode:
      type: string
      required: false
      default: audit
      description: 'audit: flag and escalate without failing. block: also fail the job.'
    notify:
      type: string
      required: false
      default: ''
      description: Handles to mention when escalating, e.g. "@org/moderators".
    payload-fields:
      type: string
      required: false
      default: ''
      description: Dot paths into the event payload of the texts to screen, e.g. "pull_request.title, pull_request.body". Each path is also the text's name.
    require-fields:
      type: boolean
      required: false
      default: true
      description: Whether a payload-fields path that isn't in the event payload is an error, so a misspelled path such as pull_request.bdy fails. false makes it a warning, for paths that only some events carry.
    require-text:
      type: boolean
      required: false
      default: true
      description: Whether finding nothing to screen is an error. false makes it a warning and the verdict clean.
    threshold:
      type: string
      required: false
      default: '0.5'
      description: The score, between 0 and 1, at or above which a text is flagged.
  secrets:
    CF_ACCESS_CLIENT_ID:
      required: false
    CF_ACCESS_CLIENT_SECRET:
      required: false
    PROMPT_GUARD_CLIENT_ID:
      required: false
  outputs:
    escalated:
      description: true when the comment or the issue was posted.
      value: ${{ jobs.guard.outputs.escalated }}
    flagged:
      description: A JSON array of the flagged names.
      value: ${{ jobs.guard.outputs.flagged }}
    scores:
      description: A JSON object mapping each screened name to its highest score.
      value: ${{ jobs.guard.outputs.scores }}
    verdict:
      description: clean, flagged or error; empty if the job failed before screening.
      value: ${{ jobs.guard.outputs.verdict }}
    would-escalate:
      description: true when a text was flagged.
      value: ${{ jobs.guard.outputs.would-escalate }}
uses:
  - job: guard
    step: guard
    uses: .
    with:
      access-client-id: ${{ secrets.PROMPT_GUARD_CLIENT_ID }}
      access-client-secret: ${{ secrets.PROMPT_GUARD_CLIENT_ID && steps.secrets.outputs.access_secret || '' }}
      address: ${{ env.TEI_ADDRESS }}
      api-key: ${{ steps.secrets.outputs.api_key }}
      dry-run: ${{ inputs.dry-run }}
      files: ${{ inputs.files }}
      files-directory: ${{ steps.artifact.outputs.path }}
      label: ${{ inputs.label }}
      marker: ${{ inputs.marker }}
      mode: ${{ inputs.mode }}
      notify: ${{ inputs.notify }}
      payload-fields: ${{ inputs.payload-fields }}
      require-fields: ${{ inputs.require-fields }}
      require-text: ${{ inputs.require-text }}
      threshold: ${{ inputs.threshold }}
consumers:
  - from: .github/workflows/integration.yml
    job: integration
    passes:
      - artifact
      - dry-run
      - files
      - mode
    reads:
      - escalated
      - flagged
      - scores
      - verdict
      - would-escalate
